name: Build

on:
  push:
    branches:
      - main
      - mc/1.21.1
  pull_request:
    branches:
      - main
      - mc/1.21.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-1.21.1
          path: build/libs/*.jar
