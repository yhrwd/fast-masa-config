name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Build a single target from versions/ (empty = all targets)'
        required: false
        type: string
  workflow_call:
    inputs:
      target:
        description: 'Build a single target from versions/ (empty = all targets)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # The build matrix is derived from the versions/ directory listing, so
  # adding or retiring a version target never requires touching CI.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List build targets
        id: list
        env:
          SINGLE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "$SINGLE_TARGET" ]; then
            if [ ! -d "versions/$SINGLE_TARGET" ]; then
              echo "::error::Unknown build target '$SINGLE_TARGET' (no versions/$SINGLE_TARGET directory)"
              exit 1
            fi
            matrix="$(jq -cn --arg t "$SINGLE_TARGET" '[$t]')"
          else
            matrix="$(find versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)"
          fi
          echo "Build matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(matrix.target, '1.') && '21' || '25' }}
          distribution: temurin

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ matrix.target }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.target }}-
            gradle-

      - name: Build MaLiLib (1.21.4 only)
        if: matrix.target == '1.21.4'
        uses: ./.github/actions/build-malilib

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew -Ptarget=${{ matrix.target }} build --no-daemon

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-${{ matrix.target }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
