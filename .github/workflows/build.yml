name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - 26.3
          - 26.2
          - 26.1.2
          - 1.21.11
          - 1.21.9-1.21.10
          - 1.21.6-1.21.8
          - 1.21.5
          - 1.21.4
          - 1.21.2-1.21.3
          - 1.21-1.21.1

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Setup JDK
      # ------------------------------------------------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(matrix.target, '1.') && '21' || '25' }}
          distribution: temurin

      # ------------------------------------------------------------
      # Cache Gradle
      # ------------------------------------------------------------
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ matrix.target }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.target }}-
            gradle-

      # ------------------------------------------------------------
      # MaLiLib
      #
      # Only 1.21.4 needs the Git commit version of MaLiLib.
      #
      # Your build.gradle expects:
      #
      # com.github.sakura-ryoko:malilib:
      # aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1
      #
      # So we build the exact MaLiLib commit locally and create
      # a Maven Local alias with those coordinates.
      # ------------------------------------------------------------
      - name: Build MaLiLib (1.21.4 only)
        if: matrix.target == '1.21.4'
        shell: bash
        run: |
          set -euo pipefail

          MALILIB_COMMIT="aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1"
          MALILIB_VERSION="0.23.5"

          echo "============================================================"
          echo "Building MaLiLib"
          echo "Commit : $MALILIB_COMMIT"
          echo "Version: $MALILIB_VERSION"
          echo "============================================================"

          git clone https://github.com/sakura-ryoko/malilib.git
          cd malilib

          git checkout "$MALILIB_COMMIT"

          echo
          echo "MaLiLib commit:"
          git rev-parse HEAD

          echo
          echo "Java version:"
          java -version

          echo
          echo "Building and publishing MaLiLib to Maven Local..."

          ./gradlew publishToMavenLocal --no-daemon

          cd ..

          # --------------------------------------------------------
          # Inspect Maven Local
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "Searching Maven Local for MaLiLib"
          echo "============================================================"

          echo "All MaLiLib artifacts currently in Maven Local:"

          find "$HOME/.m2/repository" \
            -type f \
            \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) \
            | grep -i 'malilib' \
            | sort || true

          # --------------------------------------------------------
          # Find the actual published JAR.
          #
          # Do NOT assume the Maven path from the Gradle coordinates.
          # MaLiLib's publication configuration uses its own artifactId.
          # --------------------------------------------------------
          jar_file="$(
            find "$HOME/.m2/repository" \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | grep -i 'malilib' \
              | head -n 1
          )"

          if [ -z "$jar_file" ]; then
            echo "::error::Could not find MaLiLib JAR in Maven Local."

            echo
            echo "Maven Local directory:"
            find "$HOME/.m2/repository" \
              -maxdepth 6 \
              -type f \
              | sort || true

            exit 1
          fi

          echo
          echo "Found MaLiLib JAR:"
          echo "  $jar_file"

          jar_dir="$(dirname "$jar_file")"

          # --------------------------------------------------------
          # Find POM next to the JAR
          # --------------------------------------------------------
          pom_file="$(
            find "$jar_dir" \
              -maxdepth 1 \
              -type f \
              -name '*.pom' \
              | head -n 1
          )"

          if [ -z "$pom_file" ]; then
            echo "::error::Could not find MaLiLib POM next to JAR:"
            echo "  $jar_file"

            echo
            echo "Directory contents:"
            find "$jar_dir" -maxdepth 1 -type f -print | sort

            exit 1
          fi

          echo
          echo "Found MaLiLib POM:"
          echo "  $pom_file"

          # --------------------------------------------------------
          # Optional sources JAR
          # --------------------------------------------------------
          sources_jar="$(
            find "$jar_dir" \
              -maxdepth 1 \
              -type f \
              -name '*-sources.jar' \
              | head -n 1 || true
          )"

          # --------------------------------------------------------
          # Create Maven Local alias
          #
          # Expected by the main project:
          #
          # ~/.m2/repository/
          #   com/github/sakura-ryoko/malilib/
          #     aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1/
          #       malilib-aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1.jar
          #       malilib-aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1.pom
          # --------------------------------------------------------
          DST="$HOME/.m2/repository/com/github/sakura-ryoko/malilib/$MALILIB_COMMIT"

          mkdir -p "$DST"

          cp \
            "$jar_file" \
            "$DST/malilib-$MALILIB_COMMIT.jar"

          if [ -n "$sources_jar" ]; then
            cp \
              "$sources_jar" \
              "$DST/malilib-$MALILIB_COMMIT-sources.jar"
          fi

          # --------------------------------------------------------
          # Rewrite POM coordinates
          # --------------------------------------------------------
          sed \
            -e 's#<groupId>fi\.dy\.masa</groupId>#<groupId>com.github.sakura-ryoko</groupId>#' \
            -e 's#<artifactId>malilib-fabric-1\.21\.4</artifactId>#<artifactId>malilib</artifactId>#' \
            -e "s#<version>$MALILIB_VERSION</version>#<version>$MALILIB_COMMIT</version>#" \
            "$pom_file" \
            > "$DST/malilib-$MALILIB_COMMIT.pom"

          # --------------------------------------------------------
          # Verify alias
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "Maven alias created"
          echo "============================================================"

          find "$DST" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          test -f "$DST/malilib-$MALILIB_COMMIT.jar"
          test -f "$DST/malilib-$MALILIB_COMMIT.pom"

          echo
          echo "MaLiLib alias is ready:"
          echo
          echo "  com.github.sakura-ryoko:malilib:$MALILIB_COMMIT"
          echo

          echo "POM:"
          cat "$DST/malilib-$MALILIB_COMMIT.pom"

      # ------------------------------------------------------------
      # Gradle wrapper
      # ------------------------------------------------------------
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Build project
      # ------------------------------------------------------------
      - name: Build
        run: |
          ./gradlew \
            -Ptarget=${{ matrix.target }} \
            build \
            --no-daemon

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-${{ matrix.target }}
          path: build/libs/*.jar
          if-no-files-found: error
