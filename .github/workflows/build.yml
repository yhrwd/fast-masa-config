name: Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - 26.3
          - 26.2
          - 26.1.2
          - 1.21.11
          - 1.21.9-1.21.10
          - 1.21.6-1.21.8
          - 1.21.5
          - 1.21.4
          - 1.21.2-1.21.3
          - 1.21-1.21.1

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Java
      # ============================================================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(matrix.target, '1.') && '21' || '25' }}
          distribution: temurin

      # ============================================================
      # Gradle cache
      # ============================================================
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ matrix.target }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.target }}-

      # ============================================================
      # Gradle wrapper
      # ============================================================
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # ============================================================
      # MaLiLib
      #
      # 1.21.4 uses a MaLiLib commit that is not available from the
      # Maven repository under the coordinates expected by this
      # project.
      #
      # Build that exact commit locally and create a Maven Local
      # alias:
      #
      #   com.github.sakura-ryoko:malilib:
      #   aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1
      #
      # This keeps build.gradle unchanged.
      # ============================================================
      - name: Build MaLiLib (1.21.4 only)
        if: matrix.target == '1.21.4'
        shell: bash
        run: |
          set -euo pipefail

          MALILIB_COMMIT="aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1"
          MALILIB_VERSION="0.23.5"

          echo "============================================================"
          echo "Building MaLiLib"
          echo "Commit : $MALILIB_COMMIT"
          echo "Version: $MALILIB_VERSION"
          echo "============================================================"

          # ----------------------------------------------------------
          # Clone exact MaLiLib commit
          # ----------------------------------------------------------
          git clone https://github.com/sakura-ryoko/malilib.git

          cd malilib

          git checkout "$MALILIB_COMMIT"

          # ----------------------------------------------------------
          # Publish MaLiLib to Maven Local
          # ----------------------------------------------------------
          ./gradlew publishToMavenLocal --no-daemon

          # ----------------------------------------------------------
          # MaLiLib's actual Maven coordinates
          #
          # fi.dy.masa:
          #   malilib-fabric-1.21.4:
          #   0.23.5
          # ----------------------------------------------------------
          SRC="$HOME/.m2/repository/fi/dy/masa/malilib-fabric-1.21.4/$MALILIB_VERSION"

          # ----------------------------------------------------------
          # Coordinates expected by fast-masa-config
          #
          # com.github.sakura-ryoko:
          #   malilib:
          #   aa2ace...
          # ----------------------------------------------------------
          DST="$HOME/.m2/repository/com/github/sakura-ryoko/malilib/$MALILIB_COMMIT"

          echo
          echo "Source Maven directory:"
          echo "  $SRC"

          echo
          echo "Target Maven directory:"
          echo "  $DST"

          # ----------------------------------------------------------
          # Verify source directory
          # ----------------------------------------------------------
          if [ ! -d "$SRC" ]; then
            echo "::error::MaLiLib Maven directory was not found:"
            echo "$SRC"
            exit 1
          fi

          # ----------------------------------------------------------
          # Show exactly what MaLiLib published.
          # This also makes future failures much easier to diagnose.
          # ----------------------------------------------------------
          echo
          echo "============================================================"
          echo "Published MaLiLib files"
          echo "============================================================"

          find "$SRC" -maxdepth 1 -type f -print | sort

          # ----------------------------------------------------------
          # Find published artifacts without assuming their filenames.
          # ----------------------------------------------------------
          jar_file="$(
            find "$SRC" \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*-sources.jar' \
              | head -n 1
          )"

          sources_jar="$(
            find "$SRC" \
              -maxdepth 1 \
              -type f \
              -name '*-sources.jar' \
              | head -n 1 || true
          )"

          pom_file="$(
            find "$SRC" \
              -maxdepth 1 \
              -type f \
              -name '*.pom' \
              | head -n 1
          )"

          # ----------------------------------------------------------
          # Verify required artifacts
          # ----------------------------------------------------------
          if [ -z "$jar_file" ]; then
            echo "::error::MaLiLib JAR was not found in:"
            echo "$SRC"
            exit 1
          fi

          if [ -z "$pom_file" ]; then
            echo "::error::MaLiLib POM was not found in:"
            echo "$SRC"
            exit 1
          fi

          echo
          echo "Resolved MaLiLib JAR:"
          echo "  $jar_file"

          echo
          echo "Resolved MaLiLib POM:"
          echo "  $pom_file"

          if [ -n "$sources_jar" ]; then
            echo
            echo "Resolved MaLiLib sources:"
            echo "  $sources_jar"
          fi

          # ----------------------------------------------------------
          # Create Maven Local alias
          # ----------------------------------------------------------
          mkdir -p "$DST"

          # ----------------------------------------------------------
          # Copy main JAR
          # ----------------------------------------------------------
          cp \
            "$jar_file" \
            "$DST/malilib-$MALILIB_COMMIT.jar"

          # ----------------------------------------------------------
          # Copy sources JAR when available
          # ----------------------------------------------------------
          if [ -n "$sources_jar" ]; then
            cp \
              "$sources_jar" \
              "$DST/malilib-$MALILIB_COMMIT-sources.jar"
          fi

          # ----------------------------------------------------------
          # Rewrite the original POM coordinates.
          #
          # Original:
          #
          #   fi.dy.masa:
          #   malilib-fabric-1.21.4:
          #   0.23.5
          #
          # Becomes:
          #
          #   com.github.sakura-ryoko:
          #   malilib:
          #   aa2ace...
          #
          # All other dependency information in the original POM
          # remains untouched.
          # ----------------------------------------------------------
          sed \
            -e 's#<groupId>fi\.dy\.masa</groupId>#<groupId>com.github.sakura-ryoko</groupId>#' \
            -e 's#<artifactId>malilib-fabric-1\.21\.4</artifactId>#<artifactId>malilib</artifactId>#' \
            -e "s#<version>$MALILIB_VERSION</version>#<version>$MALILIB_COMMIT</version>#" \
            "$pom_file" \
            > "$DST/malilib-$MALILIB_COMMIT.pom"

          # ----------------------------------------------------------
          # Verify final Maven Local alias
          # ----------------------------------------------------------
          echo
          echo "============================================================"
          echo "Maven alias created"
          echo "============================================================"

          find "$DST" -maxdepth 1 -type f -print | sort

          echo
          echo "Maven coordinate:"
          echo "  com.github.sakura-ryoko:malilib:$MALILIB_COMMIT"

          # ----------------------------------------------------------
          # Verify required files exist
          # ----------------------------------------------------------
          test -f "$DST/malilib-$MALILIB_COMMIT.jar"
          test -f "$DST/malilib-$MALILIB_COMMIT.pom"

          echo
          echo "MaLiLib Maven alias is ready."

          # Go back to the main repository.
          cd ..

      # ============================================================
      # Build
      # ============================================================
      - name: Build
        run: |
          ./gradlew \
            -Ptarget=${{ matrix.target }} \
            build \
            --no-daemon

      # ============================================================
      # Upload build artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-${{ matrix.target }}
          path: build/libs/*.jar
