name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Build a single target from versions/ (empty = full matrix)'
        required: false
        type: string
  workflow_call:
    inputs:
      target:
        description: 'Build a single target from versions/ (empty = full matrix)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # A caller-provided target builds just that one target;
        # otherwise every supported target from versions/ is built.
        target: >-
          ${{
            (inputs.target || '') != ''
              && fromJSON(format('["{0}"]', inputs.target))
              || fromJSON('["26.3","26.2","26.1.2","1.21.11","1.21.9-1.21.10","1.21.6-1.21.8","1.21.5","1.21.4","1.21.2-1.21.3","1.21-1.21.1"]')
          }}

    steps:
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(matrix.target, '1.') && '21' || '25' }}
          distribution: temurin

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ matrix.target }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.target }}-
            gradle-

      - name: Build MaLiLib (1.21.4 only)
        if: matrix.target == '1.21.4'
        uses: ./.github/actions/build-malilib

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew -Ptarget=${{ matrix.target }} build --no-daemon

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-${{ matrix.target }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
