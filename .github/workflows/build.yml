name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [26.3, 26.2, 26.1.2, 1.21.11, 1.21.9-1.21.10, 1.21.6-1.21.8, 1.21.5, 1.21.4, 1.21.2-1.21.3, 1.21-1.21.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ startsWith(matrix.target, '1.') && '21' || '25' }}
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ matrix.target }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.target }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # ========= Only for 1.21.4 ᗜ ‸ ᗜ =========
      - name: Build malilib (only for 1.21.4)
        if: matrix.target == '1.21.4'
        run: |
          git clone https://github.com/sakura-ryoko/malilib.git
          cd malilib
          git checkout aa2aceafbb50572035c3635e7b6d0c54d9d6b7c1
          ./gradlew publishToMavenLocal
        
      - name: Build
        run: ./gradlew -Ptarget=${{ matrix.target }} build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-masa-config-${{ matrix.target }}
          path: build/libs/*.jar
