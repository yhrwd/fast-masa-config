name: release

on:
  push:
    tags:
      - 'mc*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: resolve version target from tag
        id: resolve
        run: |
          # mc1.21.6-1.21.8-v5.4.0 -> target 1.21.6-1.21.8, feat version 5.4.0
          target="${GITHUB_REF_NAME#mc}"
          target="${target%%-v*}"
          if [[ "$target" == 1.* ]]; then java_version=21; else java_version=25; fi
          # Modrinth game versions for the target (comma-separated in its properties)
          game_versions="$(grep '^game_versions=' "versions/${target}/gradle.properties" | cut -d= -f2-)"
          if [ -z "${game_versions}" ]; then game_versions="${target}"; fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "java=${java_version}" >> "$GITHUB_OUTPUT"
          echo "game_versions=${game_versions}" >> "$GITHUB_OUTPUT"

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '${{ steps.resolve.outputs.java }}'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew -Ptarget=${{ steps.resolve.outputs.target }} build --no-daemon

      - name: collect release jars
        run: |
          mkdir -p release
          find build/libs -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} release/ \;

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > release-notes.md
          # Tags created from shell strings may contain literal escaped newlines.
          perl -0pi -e 's/\\\\n/\n/g' release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Automated release for %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Fast Masa Config UI ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" release/*.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.jar \
              --title "Fast Masa Config UI ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: 4Qx0KEY6
          GAME_VERSIONS: ${{ steps.resolve.outputs.game_versions }}
        run: |
          set -euo pipefail
          jar_file="$(find release -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          jar_name="$(basename "${jar_file}")"
          version_number="${GITHUB_REF_NAME#mc}"
          version_number="${version_number/-v/-}"
          changelog="$(cat release-notes.md)"
          jq -n \
            --arg project_id "${MODRINTH_PROJECT_ID}" \
            --arg version_number "${version_number}" \
            --arg version_title "Fast Masa Config UI ${version_number}" \
            --arg changelog "${changelog}" \
            --arg jar_name "${jar_name}" \
            --arg game_versions "${GAME_VERSIONS}" \
            '{project_id: $project_id, version_number: $version_number,
              version_title: $version_title, changelog: $changelog,
              version_type: "release", loaders: ["fabric"],
              game_versions: ($game_versions | split(",")), dependencies: [], featured: false,
              file_parts: [$jar_name]}' > release/metadata.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"title":"Fast Masa Config UI"}' \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}"
          existing_version_id="$(curl --fail-with-body --silent \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version" \
            | jq -r --arg version_number "${version_number}" \
              '.[] | select(.version_number == $version_number) | .id' | head -n 1)"
          if [ -n "${existing_version_id}" ] && [ "${existing_version_id}" != "null" ]; then
            update_metadata="$(jq -n \
              --arg version_title "Fast Masa Config UI ${version_number}" \
              --arg changelog "${changelog}" \
              --arg game_versions "${GAME_VERSIONS}" \
              '{name: $version_title, changelog: $changelog,
                version_type: "release", loaders: ["fabric"],
                game_versions: ($game_versions | split(",")), featured: false}')"
            curl --fail-with-body --request PATCH \
              --header "Authorization: ${MODRINTH_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "${update_metadata}" \
              "https://api.modrinth.com/v2/version/${existing_version_id}"
          else
            curl --fail-with-body --request POST \
              --header "Authorization: ${MODRINTH_TOKEN}" \
              --form "data=@release/metadata.json;type=application/json" \
              --form "${jar_name}=@${jar_file}" \
              https://api.modrinth.com/v2/version
          fi
