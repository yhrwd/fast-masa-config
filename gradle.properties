# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Shared across all version targets.
# Per-target values (minecraft/malilib/mod versions, loom pipeline, java release)
# live in versions/<target>/gradle.properties; select a target with -Ptarget=<name>.
# loom_version is global: one Loom release builds every target (verified for 1.21.1+).
loom_version=1.17-SNAPSHOT
maven_group=fastui.yure
