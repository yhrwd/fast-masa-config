plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Single-repo multi-version builds (see versions/<target>/gradle.properties).
// src/ is the common baseline (newest target); files under versions/<target>/src
// replace same-path files when building that target.
def target = project.findProperty('target') ?: '26.3'
def targetPropsFile = file("versions/${target}/gradle.properties")
if (!targetPropsFile.isFile()) {
	throw new GradleException("Unknown build target '${target}': expected ${targetPropsFile} (use -Ptarget=<name>)")
}
def targetProps = new Properties()
targetPropsFile.withReader('UTF-8') { targetProps.load(it) }

// Command-line -P and root gradle.properties win over the target file.
def targetProp = { String name ->
	if (project.hasProperty(name)) return project.property(name)
	def v = targetProps.getProperty(name)
	if (v != null) return v
	throw new GradleException("Missing property '${name}' for target '${target}' (see ${targetPropsFile.name})")
}

// Two build pipelines share this script:
//   standard = 26.x targets on the MojMap pipeline, no intermediary remapping.
//   remap    = 1.21.x targets on yarn/intermediary, mod* dependency configurations.
def remapPipeline = targetProp('loom_pipeline') == 'remap'
apply plugin: remapPipeline ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

version = targetProp('mod_version')
group = project.maven_group

// Per-target artifact output so building one target never clobbers another's jars.
base {
	libsDirectory = file("build/libs/${target}")
}

repositories {
	maven { url = 'https://masa.dy.fi/maven' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	maven { url = 'https://maven.fallenbreath.me/releases/' }
	maven { url = 'https://jitpack.io' }
	flatDir { dirs 'libs' }
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			runDir = "run/${target}"
		}
	}

	mods {
		"fast-masa-config" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

// Common files listed in versions/<target>/common-excluded.txt (src/-relative paths)
// do not exist for this target's feature generation and are left out of the build.
def commonExcluded = new HashSet<String>()
def commonExcludedFile = file("versions/${target}/common-excluded.txt")
if (commonExcludedFile.isFile()) {
	commonExcludedFile.eachLine { line ->
		def trimmed = line.trim()
		if (trimmed && !trimmed.startsWith('#')) commonExcluded << trimmed
	}
}

// A common source file is dropped when it is excluded for this target, or shadowed
// by the same path in the override tree.
def srcRoot = file('src').toPath()
def shadowedBy = { java.nio.file.Path commonRoot, java.nio.file.Path overrideRoot ->
	return { element ->
		def f = element.file
		if (!f.isFile()) return false
		def p = f.toPath()
		if (!p.startsWith(commonRoot)) return false
		def srcRelative = srcRoot.relativize(p).toString().replace(File.separatorChar, '/' as char)
		if (commonExcluded.contains(srcRelative)) return true
		overrideRoot.resolve(commonRoot.relativize(p)).toFile().exists()
	}
}

sourceSets {
	main {
		java {
			srcDir "versions/${target}/src/main/java"
			exclude shadowedBy(file('src/main/java').toPath(), file("versions/${target}/src/main/java").toPath())
		}
		resources {
			srcDir "versions/${target}/src/main/resources"
			exclude shadowedBy(file('src/main/resources').toPath(), file("versions/${target}/src/main/resources").toPath())
		}
	}
	client {
		java {
			srcDir "versions/${target}/src/client/java"
			exclude shadowedBy(file('src/client/java').toPath(), file("versions/${target}/src/client/java").toPath())
		}
		resources {
			srcDir "versions/${target}/src/client/resources"
			exclude shadowedBy(file('src/client/resources').toPath(), file("versions/${target}/src/client/resources").toPath())
		}
	}
	test {
		java {
			srcDir "versions/${target}/src/test/java"
			exclude shadowedBy(file('src/test/java').toPath(), file("versions/${target}/src/test/java").toPath())
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${targetProp('minecraft_version')}"

	if (remapPipeline) {
		mappings "net.fabricmc:yarn:${targetProp('yarn_mappings')}:v2"
		modImplementation "net.fabricmc:fabric-loader:${targetProp('loader_version')}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${targetProp('fabric_api_version')}"
		modImplementation "com.github.sakura-ryoko:malilib:${targetProp('malilib_version')}"
		modCompileOnly "com.terraformersmc:modmenu:${targetProp('mod_menu_version')}"
	} else {
		implementation "net.fabricmc:fabric-loader:${targetProp('loader_version')}"

		// Fabric API. This is technically optional, but you probably want it anyway.
		implementation "net.fabricmc.fabric-api:fabric-api:${targetProp('fabric_api_version')}"
		implementation "com.github.sakura-ryoko:malilib:${targetProp('malilib_version')}"
		compileOnly "com.terraformersmc:modmenu:${targetProp('mod_menu_version')}"
		// 仅开发环境加载 ModMenu，方便从主菜单直接进配置页；发布 jar 不包含它。
		clientRuntimeOnly "com.terraformersmc:modmenu:${targetProp('mod_menu_version')}"
	}

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

def javaRelease = targetProp('java_release') as Integer
tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaRelease)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
